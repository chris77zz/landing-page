<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Downloader Pro</title>

  <link rel="preconnect" href="https://libtl.com">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11971068' data-sdk='show_11971068'></script>

  <style>
    html, body { margin: 0; height: 100%; background: var(--tg-theme-bg-color, #0e1621); }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .18); border-top-color: #2AABEE;
      position: absolute; top: 50%; left: 50%; margin: -17px 0 0 -17px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const botUsername = params.get("bot") || "";
    let finished = false;
    function finish() {
      if (finished) return;
      if (!token || !botUsername) {
        failAd();
        return;
      }
      finished = true;
      // Al terminar el anuncio, Telegram vuelve al bot con el token de esta solicitud.
      setTimeout(() => {
        if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
        const returnUrl = `https://t.me/${botUsername}?start=verify_${encodeURIComponent(token)}`;
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(returnUrl);
          setTimeout(() => tg.close && tg.close(), 150);
        } else {
          window.location.href = returnUrl;
        }
      }, 1000);
    }

    function failAd() {
      if (finished) return;
      finished = true;
      if (tg && tg.close) tg.close();
    }

    try {
      show_11971068({ type: "end", ymid: token, timeout: 12 })
        .then(finish)
        .catch(failAd);
    } catch (e) {
      failAd();
    }
  </script>
</body>
</html>
