<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Downloader Pro</title>

  <link rel="preconnect" href="https://libtl.com">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11971068' data-sdk='show_11971068'></script>

  <style>
    html, body { margin: 0; height: 100%; background: var(--tg-theme-bg-color, #0e1621); }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .18); border-top-color: #2AABEE;
      position: absolute; top: 50%; left: 50%; margin: -17px 0 0 -17px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const BOT_USERNAME = "videott_pro_bot";
    // Monetag muestra un contador obligatorio de 15 segundos. Esperamos un
    // segundo adicional antes de volver al bot.
    const AD_SECONDS = 16;
    const API_URL = "https://162-35-32-107.sslip.io/api/ad-complete";
    let finished = false;
    async function finish() {
      if (finished) return;
      if (!token) {
        failAd();
        return;
      }
      finished = true;

      // Avisa directamente al bot; Telegram firma initData para probar quién es el usuario.
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, initData: (tg && tg.initData) || "" }),
        });
        if (res.ok) {
          if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
          if (tg && tg.close) tg.close();
          return;
        }
      } catch (e) {}

      // Respaldo: volver al bot con /start verify_xxx.
      const returnUrl = `https://t.me/${BOT_USERNAME}?start=verify_${encodeURIComponent(token)}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(returnUrl);
        setTimeout(() => {
          if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
          tg.close();
        }, 300);
      } else {
        window.location.href = returnUrl;
      }
    }

    function failAd() {
      if (finished) return;
      finished = true;
      if (tg && tg.close) tg.close();
    }

    // Respaldo: si el SDK queda abierto, el usuario no queda atrapado en la Mini App.
    setTimeout(finish, 45000);

    try {
      show_11971068({ type: "start", ymid: token, timeout: 12 })
        .then(() => setTimeout(finish, AD_SECONDS * 1000))
        .catch(finish);
    } catch (e) {
      finish();
    }
  </script>
</body>
</html>
