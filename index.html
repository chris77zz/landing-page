<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Downloader Pro</title>

  <link rel="preconnect" href="https://libtl.com">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11971068' data-sdk='show_11971068'></script>

  <style>
    html, body { margin: 0; height: 100%; background: var(--tg-theme-bg-color, #0e1621); }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .18); border-top-color: #2AABEE;
      position: absolute; top: 50%; left: 50%; margin: -17px 0 0 -17px;
      animation: spin .8s linear infinite;
    }
    .ad-error {
      display: none; position: absolute; top: 58%; left: 8%; right: 8%;
      color: var(--tg-theme-text-color, #fff); text-align: center;
      font: 16px/1.5 sans-serif;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="ad-error" class="ad-error">The ad could not be verified. Please close this page and try again later.</p>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const BOT_USERNAME = "videott_pro_bot";   // sin @
    let finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      const link = `https://t.me/${BOT_USERNAME}?start=verify_${token}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(link);
        setTimeout(() => {
          if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
          tg.close();
        }, 300);
      } else {
        window.location.href = link;
      }
    }

    function failAd() {
      if (finished) return;
      finished = true;
      document.querySelector(".spinner").style.display = "none";
      document.getElementById("ad-error").style.display = "block";
    }

    try {
      show_11971068({ type: "end", ymid: token, timeout: 12 })
        .then(finish)
        .catch(failAd);
    } catch (e) {
      failAd();
    }
  </script>
</body>
</html>
